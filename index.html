<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="Track your meals, calories, and nutrition with smart notifications">
    <title>MealPrep - Smart Nutrition Tracker</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <h1>🥗 MealPrep</h1>
            <button id="install-btn" class="install-btn" style="display: none;">Install App</button>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-view="dashboard">Dashboard</button>
            <button class="nav-tab" data-view="foods">Foods</button>
            <button class="nav-tab" data-view="meals">Meals</button>
            <button class="nav-tab" data-view="settings">Settings</button>
        </nav>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view active">
            <div class="stats-card">
                <h2>Today's Progress</h2>
                <div class="calorie-ring">
                    <div class="calorie-info">
                        <div class="current-calories">0</div>
                        <div class="goal-calories">/ 2000 cal</div>
                    </div>
                </div>
                <div class="macro-stats">
                    <div class="macro-item">
                        <span class="macro-label">Protein</span>
                        <span class="macro-value">0g</span>
                    </div>
                    <div class="macro-item">
                        <span class="macro-label">Carbs</span>
                        <span class="macro-value">0g</span>
                    </div>
                    <div class="macro-item">
                        <span class="macro-label">Fat</span>
                        <span class="macro-value">0g</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Today's Meals</h3>
                <div id="today-meals-list" class="meals-list">
                    <p class="empty-state">No meals logged yet today</p>
                </div>
            </div>

            <button id="quick-add-btn" class="fab">+</button>
        </div>

        <!-- Foods View -->
        <div id="foods-view" class="view">
            <div class="search-section">
                <input type="text" id="food-search" class="search-input" placeholder="Search foods...">
                <button id="add-custom-food-btn" class="btn btn-primary">+ Add Custom Food</button>
            </div>
            <div id="foods-list" class="items-list"></div>
        </div>

        <!-- Meals View -->
        <div id="meals-view" class="view">
            <button id="create-meal-btn" class="btn btn-primary">+ Create Meal</button>
            <div id="meals-list" class="items-list"></div>
        </div>

        <!-- Settings View -->
        <div id="settings-view" class="view">
            <div class="settings-section">
                <h3>Daily Goals</h3>
                <div class="form-group">
                    <label>Calorie Goal</label>
                    <input type="number" id="calorie-goal" value="2000" min="0" step="100">
                </div>
                <div class="form-group">
                    <label>Protein Goal (g)</label>
                    <input type="number" id="protein-goal" value="150" min="0" step="10">
                </div>
                <div class="form-group">
                    <label>Carbs Goal (g)</label>
                    <input type="number" id="carbs-goal" value="200" min="0" step="10">
                </div>
                <div class="form-group">
                    <label>Fat Goal (g)</label>
                    <input type="number" id="fat-goal" value="65" min="0" step="5">
                </div>
                <button id="save-goals-btn" class="btn btn-primary">Save Goals</button>
            </div>

            <div class="settings-section">
                <h3>Notifications</h3>
                <button id="enable-notifications-btn" class="btn btn-secondary">Enable Notifications</button>
                <p class="notification-status">Status: <span id="notification-status">Not enabled</span></p>
                <div class="notification-times">
                    <p>Scheduled notification times:</p>
                    <ul>
                        <li>11:00 AM</li>
                        <li>3:00 PM</li>
                        <li>8:00 PM</li>
                    </ul>
                </div>
            </div>

            <div class="settings-section">
                <h3>Data Management</h3>
                <button id="export-data-btn" class="btn btn-secondary">Export Data</button>
                <button id="clear-data-btn" class="btn btn-danger">Clear All Data</button>
            </div>
        </div>
    </div>

    <!-- Modal for Quick Add -->
    <div id="quick-add-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Quick Add</h2>
            <input type="text" id="quick-search" class="search-input" placeholder="Search foods and meals...">
            <div id="quick-results" class="quick-results"></div>
        </div>
    </div>

    <!-- Modal for Custom Food -->
    <div id="custom-food-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Custom Food</h2>
            <form id="custom-food-form">
                <div class="form-group">
                    <label>Food Name *</label>
                    <input type="text" id="food-name" required>
                </div>
                <div class="form-group">
                    <label>Serving Size</label>
                    <input type="text" id="food-serving" placeholder="e.g., 1 cup, 100g">
                </div>
                <div class="form-group">
                    <label>Calories *</label>
                    <input type="number" id="food-calories" required min="0" step="1">
                </div>
                <div class="form-group">
                    <label>Protein (g)</label>
                    <input type="number" id="food-protein" min="0" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label>Carbs (g)</label>
                    <input type="number" id="food-carbs" min="0" step="0.1" value="0">
                </div>
                <div class="form-group">
                    <label>Fat (g)</label>
                    <input type="number" id="food-fat" min="0" step="0.1" value="0">
                </div>
                <button type="submit" class="btn btn-primary">Add Food</button>
            </form>
        </div>
    </div>

    <!-- Modal for Create Meal -->
    <div id="create-meal-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Meal</h2>
            <form id="create-meal-form">
                <div class="form-group">
                    <label>Meal Name *</label>
                    <input type="text" id="meal-name" required>
                </div>
                <div class="form-group">
                    <label>Add Foods</label>
                    <input type="text" id="meal-food-search" class="search-input" placeholder="Search foods to add...">
                    <div id="meal-food-results" class="search-results"></div>
                </div>
                <div id="selected-foods" class="selected-foods"></div>
                <button type="submit" class="btn btn-primary">Create Meal</button>
            </form>
        </div>
    </div>

    <script src="/db.js"></script>
    <script src="/app.js"></script>
</body>
</html>
